spring.application.name=user-profile-service
spring.datasource.url=jdbc:postgresql://localhost:5432/user_profile
spring.datasource.username=user_profile_user
spring.datasource.password=user_profile_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
server.port=8083
