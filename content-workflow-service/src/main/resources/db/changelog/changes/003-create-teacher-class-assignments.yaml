databaseChangeLog:
  - changeSet:
      id: 003-create-teacher-class-assignments
      author: system
      changes:
        - createTable:
            tableName: teacher_class_assignments
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: teacher_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: class_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: assigned_at
                  type: timestamp
              - column:
                  name: assigned_by
                  type: varchar(255)
        - createIndex:
            indexName: idx_teacher_class_assignments_tenant
            tableName: teacher_class_assignments
            columns:
              - column:
                  name: tenant_id
        - createIndex:
            indexName: idx_teacher_class_assignments_teacher
            tableName: teacher_class_assignments
            columns:
              - column:
                  name: teacher_id
        - createIndex:
            indexName: idx_teacher_class_assignments_class
            tableName: teacher_class_assignments
            columns:
              - column:
                  name: class_id
