spring.application.name=content-workflow-service
server.port=8086

spring.datasource.url=jdbc:postgresql://localhost:5432/content_workflow_service
spring.datasource.username=content_workflow_service
spring.datasource.password=content_workflow_service
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
