<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBSE Class 4 Science — Mind Map</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a2e;
    --bg-subtle: #16213e;
    --surface: #0f3460;
    --border: #2a4a7f;
    --text: #e8e8e8;
    --text-dim: #8892b0;
    --accent-green: #64ffda;
    --accent-purple: #c792ea;
    --accent-orange: #ffcb6b;
    --accent-blue: #82aaff;
    --accent-pink: #f78c6c;
    --accent-cyan: #89ddff;
    --accent-red: #ff5370;
    --accent-lime: #c3e88d;
    --line: #2a4a7f88;
    --node-radius: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Figtree', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .header {
    text-align: center;
    padding: 40px 20px 10px;
    position: relative;
  }

  .header h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .header .subtitle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 6px;
    letter-spacing: 1px;
  }

  .legend {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin: 16px 0 10px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-dim);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .canvas-wrapper {
    width: 100%;
    overflow-x: auto;
    overflow-y: auto;
    padding: 20px;
    cursor: grab;
  }

  .canvas-wrapper:active { cursor: grabbing; }

  .canvas {
    position: relative;
    min-width: 1500px;
    min-height: 2600px;
    margin: 0 auto;
  }

  svg.connections {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  svg.connections path {
    fill: none;
    stroke: var(--line);
    stroke-width: 2;
    stroke-dasharray: 6 4;
    opacity: 0;
    animation: dashDraw 0.6s ease forwards;
  }

  @keyframes dashDraw {
    to { opacity: 1; }
  }

  .node {
    position: absolute;
    padding: 10px 18px;
    border-radius: var(--node-radius);
    border: 1.5px solid var(--border);
    background: var(--bg-subtle);
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2;
    white-space: nowrap;
    user-select: none;
    opacity: 0;
    transform: translateY(12px);
    animation: nodeIn 0.4s ease forwards;
  }

  .node:hover {
    transform: translateY(-2px) !important;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    z-index: 10;
  }

  .node.expanded {
    background: var(--surface);
    border-color: var(--accent-blue);
    box-shadow: 0 0 20px rgba(130, 170, 255, 0.15);
  }

  @keyframes nodeIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .node.root {
    background: linear-gradient(135deg, #0f3460, #1a1a4e);
    border: 2px solid var(--accent-green);
    font-size: 1rem;
    font-weight: 700;
    padding: 14px 28px;
    box-shadow: 0 0 40px rgba(100, 255, 218, 0.1);
  }

  .node.chapter {
    font-weight: 600;
    font-size: 0.88rem;
    padding: 12px 20px;
  }

  .node .icon { margin-right: 6px; }

  .node-tag {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.55rem;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
    letter-spacing: 0.5px;
    font-weight: 600;
  }

  .tooltip {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: #0d1b2a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.72rem;
    color: var(--text-dim);
    white-space: normal;
    width: 220px;
    z-index: 100;
    line-height: 1.5;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    font-family: 'IBM Plex Mono', monospace;
  }

  .node:hover .tooltip { display: block; }

  .zoom-controls {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 999;
  }

  .zoom-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
  }

  .zoom-btn:hover {
    background: var(--surface);
    border-color: var(--accent-blue);
  }

  /* Color coding per chapter */
  .c-plants { border-left: 3px solid var(--accent-green); }
  .c-animals { border-left: 3px solid var(--accent-orange); }
  .c-food { border-left: 3px solid var(--accent-pink); }
  .c-body { border-left: 3px solid var(--accent-red); }
  .c-air-water { border-left: 3px solid var(--accent-cyan); }
  .c-matter { border-left: 3px solid var(--accent-purple); }
  .c-force { border-left: 3px solid var(--accent-blue); }
  .c-earth { border-left: 3px solid var(--accent-lime); }

  .ch-plants { border-color: var(--accent-green); color: var(--accent-green); }
  .ch-animals { border-color: var(--accent-orange); color: var(--accent-orange); }
  .ch-food { border-color: var(--accent-pink); color: var(--accent-pink); }
  .ch-body { border-color: var(--accent-red); color: var(--accent-red); }
  .ch-air-water { border-color: var(--accent-cyan); color: var(--accent-cyan); }
  .ch-matter { border-color: var(--accent-purple); color: var(--accent-purple); }
  .ch-force { border-color: var(--accent-blue); color: var(--accent-blue); }
  .ch-earth { border-color: var(--accent-lime); color: var(--accent-lime); }

  .tag-green { background: rgba(100,255,218,0.12); color: var(--accent-green); }
  .tag-orange { background: rgba(255,203,107,0.12); color: var(--accent-orange); }
  .tag-pink { background: rgba(247,140,108,0.12); color: var(--accent-pink); }
  .tag-red { background: rgba(255,83,112,0.12); color: var(--accent-red); }
  .tag-cyan { background: rgba(137,221,255,0.12); color: var(--accent-cyan); }
  .tag-purple { background: rgba(199,146,234,0.12); color: var(--accent-purple); }
  .tag-blue { background: rgba(130,170,255,0.12); color: var(--accent-blue); }
  .tag-lime { background: rgba(195,232,141,0.12); color: var(--accent-lime); }

  .cross-link {
    stroke: var(--accent-purple) !important;
    stroke-dasharray: 3 6 !important;
    opacity: 0.35 !important;
    stroke-width: 1.5 !important;
  }
</style>
</head>

  <div class="legend">

    <div class="legend-item"><div class="legend-dot" style="background:var(--accent-orange)"></div>Animals</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent-pink)"></div>Food</div>

</div>

</div>

  ['m-states', 'm-solid'], ['m-states', 'm-liquid'], ['m-states', 'm-gas'],
  ['m-solid', 'm-dissolve'], ['m-liquid', 'm-dissolve'],
  ['m-change', 'm-material'], ['m-gas', 'm-material'],

  // Force & Energy
  ['ch-force', 'fe-force'], ['ch-force', 'fe-types'],
  ['fe-force', 'fe-gravity'], ['fe-types', 'fe-friction'], ['fe-types', 'fe-magnet'],
  ['fe-gravity', 'fe-energy'], ['fe-friction', 'fe-energy'],
  ['fe-energy', 'fe-light'], ['fe-energy', 'fe-sound'],

  // Earth
  ['ch-earth', 'e-solar'], ['ch-earth', 'e-earth'],
  ['e-solar', 'e-daynight'], ['e-earth', 'e-seasons'], ['e-earth', 'e-moon'],
  ['e-daynight', 'e-rock'], ['e-seasons', 'e-rock'],
  ['e-moon', 'e-resources'], ['e-rock', 'e-resources'],
];

// === CROSS-LINKS (conceptual connections across chapters) ===
const crossLinks = [
  ['p-leaf', 'w-air-prop'],         // Photosynthesis needs air (CO₂, O₂)
  ['p-adapt', 'a-adapt'],           // Both adapt to environment
  ['a-food-habit', 'f-sources'],    // Animals & food chain
  ['b-teeth', 'a-teeth'],           // Teeth in humans & animals
  ['f-balanced', 'b-hygiene'],      // Balanced diet → health
  ['w-states', 'm-states'],         // States of water ↔ states of matter
  ['w-pollution', 'e-resources'],   // Pollution affects natural resources
  ['fe-gravity', 'e-earth'],        // Gravity ↔ Earth
  ['fe-light', 'e-daynight'],       // Light → Day & Night
  ['p-root', 'w-cycle'],            // Roots absorb water from water cycle
];

// === RENDER NODES ===
const nodeMap = {};
nodes.forEach((n, i) => {
  const div = document.createElement('div');
  div.className = `node ${n.type || ''} ${n.cls || ''}`;
  div.id = n.id;
  div.style.left = n.x + 'px';
  div.style.top = n.y + 'px';
  div.style.animationDelay = (i * 30) + 'ms';
  div.innerHTML = n.label;

  if (n.tip) {
    div.innerHTML += `<div class="tooltip">${n.tip}</div>`;
  }

  canvas.appendChild(div);
  nodeMap[n.id] = div;
});

// === DRAW CONNECTIONS ===
function getCenter(id) {
  const el = nodeMap[id];
  if (!el) return { x: 0, y: 0 };
  const x = el.offsetLeft + el.offsetWidth / 2;
  const y = el.offsetTop + el.offsetHeight / 2;
  return { x, y };
}

function drawEdges() {
  svg.innerHTML = '';
  svg.setAttribute('width', canvas.scrollWidth);
  svg.setAttribute('height', canvas.scrollHeight);

  edges.forEach(([from, to], i) => {
    const a = getCenter(from);
    const b = getCenter(to);
    const midY = (a.y + b.y) / 2;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M${a.x},${a.y} C${a.x},${midY} ${b.x},${midY} ${b.x},${b.y}`);
    path.style.animationDelay = (i * 20) + 'ms';
    svg.appendChild(path);
  });

  crossLinks.forEach(([from, to], i) => {
    const a = getCenter(from);
    const b = getCenter(to);
    const midX = (a.x + b.x) / 2;
    const midY = (a.y + b.y) / 2 - 30;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M${a.x},${a.y} Q${midX},${midY} ${b.x},${b.y}`);
    path.classList.add('cross-link');
    path.style.animationDelay = (edges.length * 20 + i * 40) + 'ms';
    svg.appendChild(path);
  });
}

setTimeout(drawEdges, 100);
window.addEventListener('resize', drawEdges);

// === ZOOM ===
function zoom(delta) {
  scale = Math.max(0.3, Math.min(2, scale + delta));
  canvas.style.transform = `scale(${scale})`;
  canvas.style.transformOrigin = 'top left';
}

function resetZoom() {
  scale = 1;
  canvas.style.transform = `scale(1)`;
}

// === PAN ===
const wrapper = document.getElementById('wrapper');
let isPanning = false, startX, startY, scrollL, scrollT;

wrapper.addEventListener('mousedown', e => {
  if (e.target.closest('.node')) return;
  isPanning = true;
  startX = e.pageX - wrapper.offsetLeft;
  startY = e.pageY - wrapper.offsetTop;
  scrollL = wrapper.scrollLeft;
  scrollT = wrapper.scrollTop;
});

wrapper.addEventListener('mousemove', e => {
  if (!isPanning) return;
  e.preventDefault();
  const x = e.pageX - wrapper.offsetLeft;
  const y = e.pageY - wrapper.offsetTop;
  wrapper.scrollLeft = scrollL - (x - startX);
  wrapper.scrollTop = scrollT - (y - startY);
});

document.addEventListener('mouseup', () => isPanning = false);
</script>
</body>
</html>
