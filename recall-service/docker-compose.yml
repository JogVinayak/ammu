version: '3.8'

services:
  recall-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recall-service
    ports:
      - "8091:8091"
    environment:
      - SPRING_APPLICATION_NAME=recall-service
      - SERVER_PORT=8091
      # Use shared postgres container
      - SPRING_DATASOURCE_URL=jdbc:postgresql://role-permission-postgres:5432/recall_service
      - SPRING_DATASOURCE_USERNAME=recall_service
      - SPRING_DATASOURCE_PASSWORD=recall_service
      - SPRING_LIQUIBASE_ENABLED=true
      # Test notifications
      - TEST_NOTIFICATIONS_ENABLED=true
      - TEST_NOTIFICATIONS_TENANT_ID=fa000000-0000-0000-0000-000000000001
      - TEST_NOTIFICATIONS_USER_IDS=fa300000-0000-0000-0000-000000000001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - learner-network
    restart: unless-stopped

networks:
  learner-network:
    name: learner-network
    driver: bridge
