spring.application.name=recall-service
spring.datasource.url=jdbc:postgresql://localhost:5432/recall
spring.datasource.username=recall_user
spring.datasource.password=recall_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
springdoc.swagger-ui.path=/swagger-ui
server.port=8091

# Reminder scheduler
recall.reminders.enabled=true
recall.reminders.interval-ms=60000
recall.reminders.cooldown-seconds=3600
recall.reminders.batch-size=200

# Test notifications (for development/testing)
# Set to true to enable test notifications every minute
test.notifications.enabled=false
test.notifications.interval-ms=600000
test.notifications.tenant-id=tenant-greenwood
# Comma-separated list of test user UUIDs (students)
test.notifications.user-ids=a2000001-0001-0001-0001-000000000001,a2000001-0001-0001-0001-000000000002
