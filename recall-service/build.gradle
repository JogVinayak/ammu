plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.learning'
version = '0.0.1-SNAPSHOT'
description = 'Recall scheduling service for Amogh'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.liquibase:liquibase-core'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Docker configuration
def dockerImageName = 'recall-service'
def dockerImageTag = version
def containerName = 'recall-service'
def containerPort = 8091

tasks.register('dockerBuild', Exec) {
	group = 'docker'
	description = 'Build Docker image'
	dependsOn bootJar
	commandLine 'docker', 'build', '-t', "${dockerImageName}:${dockerImageTag}", '-t', "${dockerImageName}:latest", '.'
}

tasks.register('dockerStop', Exec) {
	group = 'docker'
	description = 'Stop and remove container'
	commandLine 'sh', '-c', "docker stop ${containerName} 2>/dev/null || true && docker rm ${containerName} 2>/dev/null || true"
}

tasks.register('dockerRun', Exec) {
	group = 'docker'
	description = 'Run container'
	dependsOn dockerBuild, dockerStop
	commandLine 'docker', 'run', '-d', '--name', containerName, '-p', "${containerPort}:${containerPort}", '--network', 'learner-network',
		'-e', 'SPRING_DATASOURCE_URL=jdbc:postgresql://recall-postgres:5432/recall',
		'-e', 'SPRING_DATASOURCE_USERNAME=recall_user', '-e', 'SPRING_DATASOURCE_PASSWORD=recall_password',
		"${dockerImageName}:latest"
}

tasks.register('dockerDeploy') {
	group = 'docker'
	description = 'Build and deploy to Docker'
	dependsOn dockerRun
	doLast { println "${containerName} deployed on port ${containerPort}" }
}

tasks.register('dockerLogs', Exec) { group = 'docker'; commandLine 'docker', 'logs', '-f', containerName }
tasks.register('dockerStatus', Exec) { group = 'docker'; commandLine 'docker', 'ps', '-a', '--filter', "name=${containerName}" }
