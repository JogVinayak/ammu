plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.learning'
version = '0.0.1-SNAPSHOT'
description = 'tenant-service'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.liquibase:liquibase-core'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Docker configuration
def dockerImageName = 'tenant-service'
def dockerImageTag = version
def containerName = 'tenant-service'
def containerPort = 8082

tasks.register('dockerBuild', Exec) {
	group = 'docker'
	description = 'Build Docker image for tenant-service'
	dependsOn bootJar
	commandLine 'docker', 'build', '-t', "${dockerImageName}:${dockerImageTag}", '-t', "${dockerImageName}:latest", '.'
}

tasks.register('dockerStop', Exec) {
	group = 'docker'
	description = 'Stop and remove tenant-service container'
	commandLine 'sh', '-c', "docker stop ${containerName} 2>/dev/null || true && docker rm ${containerName} 2>/dev/null || true"
}

tasks.register('dockerRun', Exec) {
	group = 'docker'
	description = 'Run tenant-service container'
	dependsOn dockerBuild, dockerStop
	commandLine 'docker', 'run', '-d',
		'--name', containerName,
		'-p', "${containerPort}:${containerPort}",
		'--network', 'learner-network',
		'-e', 'SPRING_DATASOURCE_URL=jdbc:postgresql://tenant-postgres:5432/tenant',
		'-e', 'SPRING_DATASOURCE_USERNAME=tenant_user',
		'-e', 'SPRING_DATASOURCE_PASSWORD=tenant_password',
		"${dockerImageName}:latest"
}

tasks.register('dockerDeploy') {
	group = 'docker'
	description = 'Build and deploy tenant-service to Docker'
	dependsOn dockerRun
	doLast {
		println "tenant-service deployed successfully!"
		println "Container: ${containerName}"
		println "Port: ${containerPort}"
		println "Health check: http://localhost:${containerPort}/actuator/health"
	}
}

tasks.register('dockerLogs', Exec) {
	group = 'docker'
	description = 'Show tenant-service container logs'
	commandLine 'docker', 'logs', '-f', containerName
}

tasks.register('dockerStatus', Exec) {
	group = 'docker'
	description = 'Show tenant-service container status'
	commandLine 'docker', 'ps', '-a', '--filter', "name=${containerName}"
}
