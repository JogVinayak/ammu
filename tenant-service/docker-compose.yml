version: '3.8'

services:
  tenant-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tenant-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_APPLICATION_NAME=tenant-service
      - SERVER_PORT=8082
      # Use shared postgres container from role-permission-service
      - SPRING_DATASOURCE_URL=jdbc:postgresql://role-permission-postgres:5432/tenant
      - SPRING_DATASOURCE_USERNAME=tenant_user
      - SPRING_DATASOURCE_PASSWORD=tenant_password
      - SPRING_LIQUIBASE_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - learner-network
    restart: unless-stopped

networks:
  learner-network:
    name: learner-network
    driver: bridge
