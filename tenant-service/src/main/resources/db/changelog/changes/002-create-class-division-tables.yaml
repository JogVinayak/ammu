databaseChangeLog:
  - changeSet:
      id: 7
      author: tenant-service
      changes:
        - createTable:
            tableName: school_classes
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: grade_level
                  type: integer
              - column:
                  name: description
                  type: varchar(500)
              - column:
                  name: status
                  type: varchar(32)
              - column:
                  name: created_at
                  type: timestamp with time zone
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: updated_at
                  type: timestamp with time zone
              - column:
                  name: updated_by
                  type: varchar(255)
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
        - addForeignKeyConstraint:
            baseTableName: school_classes
            baseColumnNames: tenant_id
            referencedTableName: tenants
            referencedColumnNames: id
            constraintName: fk_school_classes_tenant
        - createIndex:
            indexName: idx_school_classes_tenant_id
            tableName: school_classes
            columns:
              - column:
                  name: tenant_id
        - createIndex:
            indexName: idx_school_classes_tenant_grade
            tableName: school_classes
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: grade_level

  - changeSet:
      id: 8
      author: tenant-service
      changes:
        - createTable:
            tableName: divisions
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: class_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: varchar(100)
              - column:
                  name: status
                  type: varchar(32)
              - column:
                  name: created_at
                  type: timestamp with time zone
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: updated_at
                  type: timestamp with time zone
              - column:
                  name: updated_by
                  type: varchar(255)
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
        - addForeignKeyConstraint:
            baseTableName: divisions
            baseColumnNames: tenant_id
            referencedTableName: tenants
            referencedColumnNames: id
            constraintName: fk_divisions_tenant
        - addForeignKeyConstraint:
            baseTableName: divisions
            baseColumnNames: class_id
            referencedTableName: school_classes
            referencedColumnNames: id
            constraintName: fk_divisions_class
        - createIndex:
            indexName: idx_divisions_class_id
            tableName: divisions
            columns:
              - column:
                  name: class_id
