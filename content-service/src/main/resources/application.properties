spring.application.name=content-service
server.port=8085

spring.datasource.url=${CONTENT_DB_URL:jdbc:postgresql://localhost:5433/brain_content}
spring.datasource.username=${CONTENT_DB_USER:postgres}
spring.datasource.password=${CONTENT_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

content.jwt.secret=${CONTENT_JWT_SECRET:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
