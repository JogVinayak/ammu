name: aqua_reminder
description: A sophisticated water drinking reminder app with customizable sounds and tracking.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  
  # Notifications & Alarms
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  android_alarm_manager_plus: ^4.0.0
  workmanager: ^0.6.0
  
  # Audio
  audioplayers: ^6.0.0
  file_picker: ^8.0.0
  
  # Permissions
  permission_handler: ^11.1.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.2
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/sounds/
