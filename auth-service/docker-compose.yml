version: '3.8'

services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_APPLICATION_NAME=auth-service
      - SERVER_PORT=8081
      # Use shared postgres container from role-permission-service
      - SPRING_DATASOURCE_URL=jdbc:postgresql://role-permission-postgres:5432/auth
      - SPRING_DATASOURCE_USERNAME=auth_user
      - SPRING_DATASOURCE_PASSWORD=auth_password
      - SPRING_LIQUIBASE_ENABLED=true
      # Service URLs for Docker network
      - SERVICES_PROFILE_URL=${SERVICES_PROFILE_URL:-http://host.docker.internal:8083}
      - SERVICES_TENANT_URL=${SERVICES_TENANT_URL:-http://host.docker.internal:8082}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - learner-network
    restart: unless-stopped

networks:
  learner-network:
    name: learner-network
    driver: bridge
